---
- name: Test database connection
  hosts: all

  tasks:
    - name: Show database configuration
      ansible.builtin.debug:
        msg:
          - "DB Host: {{ db_host }}"
          - "DB Port: {{ db_port }}"
          - "DB Name: {{ db_name }}"
          - "DB User: {{ db_user }}"
          - "DB Password: {{ db_password }}"

